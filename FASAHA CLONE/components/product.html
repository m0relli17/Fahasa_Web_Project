<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm Fahasa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-grid">
        <div class="product-card">
            <div class="product-badge">-20%</div>
            <div class="product-image">
                <img src="https://cdn2.tuoitre.vn/nld/2021/1/22/13-cay-cam-ngot-161132379604435791636.jpg" alt="Cây Cam Ngọt Của Tôi">
            </div>
            <div class="product-info">
                <h3 class="product-title"><a href="#">Cây Cam Ngọt Của Tôi</a></h3>
                <div class="product-price">
                    <span class="current-price">86.400 đ</span>
                    <span class="original-price">108.000 đ</span>
                </div>
                <div class="product-rating">
                    <span class="stars">★★★★★</span>
                    <span class="review-count">(128)</span>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-badge">-15%</div>
            <div class="product-image">
                <img src="https://thuvienonline.org/wp-content/uploads/2021/04/nha-gia-kim.jpg" alt="Nhà Giả Kim">
            </div>
            <div class="product-info">
                <h3 class="product-title"><a href="#">Nhà Giả Kim</a></h3>
                <div class="product-price">
                    <span class="current-price">67.150 đ</span>
                    <span class="original-price">79.000 đ</span>
                </div>
                <div class="product-rating">
                    <span class="stars">★★★★★</span>
                    <span class="review-count">(95)</span>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-badge">-25%</div>
            <div class="product-image">
                <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcQ_WDNU9VqqTDRPCOKbGhYNYL8iTJg-dE_19REpTjEdqAF_YssL9A4ACqKPQuJO5_CoalyZryRNrRUMjcBhgwo0jwG2ni6FaNzsXRa9Hdm_gTy_x_fBs-xc" alt="Đắc Nhân Tâm">
            </div>
            <div class="product-info">
                <h3 class="product-title"><a href="#">Đắc Nhân Tâm (Khổ Nhỏ)</a></h3>
                <div class="product-price">
                    <span class="current-price">64.500 đ</span>
                    <span class="original-price">86.000 đ</span>
                </div>
                <div class="product-rating">
                    <span class="stars">★★★★☆</span>
                    <span class="review-count">(210)</span>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-badge">-10%</div>
            <div class="product-image">
                <img src="https://www.nxbtre.com.vn/Images/Book/nxbtre_full_06402022_014041.jpg" alt="Mắt Biếc">
            </div>
            <div class="product-info">
                <h3 class="product-title"><a href="#">Mắt Biếc (Tái Bản 2023)</a></h3>
                <div class="product-price">
                    <span class="current-price">99.000 đ</span>
                    <span class="original-price">110.000 đ</span>
                </div>
                <div class="product-rating">
                    <span class="stars">★★★★★</span>
                    <span class="review-count">(64)</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
