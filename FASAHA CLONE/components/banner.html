<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <!-- MAIN BANNER SECTION -->
    <section class="banner-section">
        <div class="banner-container">

            <!-- Banner chính (Slide lớn bên trái) -->
            <div class="main-slider">
                <a href="#">
                    <img src="https://cdn0.fahasa.com/media/magentotrace/portal/full/2024/10/19/Banner_20_10_840x320.jpg" alt="Chương trình 20/10">
                </a>
                <!-- Chấm chuyển slide (Pagination dots) -->
                <div class="slider-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- 4 Banner nhỏ bên dưới/bên cạnh -->
            <div class="sub-banners">
                <a href="#" class="sub-banner-item">
                    <img src="https://cdn0.fahasa.com/media/wysiwyg/Thang-10-2024/ThapSangTriThuc_310x210.jpg" alt="Thắp sáng tri thức">
                </a>
                <a href="#" class="sub-banner-item">
                    <img src="https://cdn0.fahasa.com/media/wysiwyg/Thang-10-2024/LeHoiMaQuai_310x210.jpg" alt="Lễ hội ma quái">
                </a>
                <a href="#" class="sub-banner-item">
                    <img src="https://cdn0.fahasa.com/media/wysiwyg/Thang-10-2024/Deli_310x210.jpg" alt="Hành trang sẵn sàng">
                </a>
                <a href="#" class="sub-banner-item">
                    <img src="https://cdn0.fahasa.com/media/wysiwyg/Thang-10-2024/HieuMinh_310x210.jpg" alt="Hiểu mình hiểu người">
                </a>
            </div>

        </div>
    </section>
</body>
</html>
